async function sha(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('regi:'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=5381;for(const ch of 'regi:'+s)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'x'+h.toString(16);
  }
}

/* ---------- 데이터 어댑터 ---------- */
function demoAdapter(){
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const pool=['민수','지연','도현','서윤','하준','예린','태양','수아','지후','유진','건우','나연','시우','다은','준서','채원','현우','소민','재민'];
  const tabsData=[{id:'t1',title:'성역1',order:1,hue:0},{id:'t2',title:'본부',order:2,hue:1},{id:'t3',title:'본캐팟',order:3,hue:2}];
  const ent={t1:new Map(),t2:new Map(),t3:new Map()};
  [['t1',19,.55],['t2',12,.5],['t3',8,.6]].forEach(([t,n,p])=>{
    pool.slice(0,n).forEach(nm=>{
      const b=new Uint8Array(N);
      D.forEach((_,d)=>{if(rnd()<p){const a=Math.floor(18+rnd()*22),len=2+Math.floor(rnd()*10);for(let i=a;i<Math.min(48,a+len);i++)b[d*48+i]=1}});
      ent[t].set(nm,toStr(b));
    });
  });
  ent.t1.set('민수1',toStr((()=>{const b=new Uint8Array(N);[30,31,32,33].forEach(i=>b[i]=1);return b})()));
  let adminHash=null;
  const tabSubs=new Set(),entSubs=new Map();
  const tabList=()=>tabsData.map(t=>({...t}));
  const entList=t=>[...(ent[t]||new Map())].map(([name,slots])=>({name,slots}));
  const notifyTabs=()=>tabSubs.forEach(cb=>cb(tabList(),{fromCache:false}));
  const notifyEnt=t=>(entSubs.get(t)||new Set()).forEach(cb=>cb(entList(t)));
  return {
    label:'데모 모드',
    subscribeTabs(cb){tabSubs.add(cb);setTimeout(()=>cb(tabList(),{fromCache:false}),0);return()=>tabSubs.delete(cb)},
    subscribeEntries(t,cb){if(!entSubs.has(t))entSubs.set(t,new Set());entSubs.get(t).add(cb);setTimeout(()=>cb(entList(t)),0);return()=>entSubs.get(t).delete(cb)},
    async saveEntry(t,name,slots){ent[t].set(name,slots);notifyEnt(t)},
    async deleteEntry(t,name){ent[t].delete(name);notifyEnt(t)},
    async clearTab(t){ent[t]=new Map();notifyEnt(t)},
    async addTab(title,order,hue){const id='t'+Date.now();tabsData.push({id,title,order,hue});ent[id]=new Map();notifyTabs();return id},
    async renameTab(id,title){tabsData.find(t=>t.id===id).title=title;notifyTabs()},
    async seedTabs(){},
    async getAdminHash(){return adminHash},
    async setAdminHash(h){adminHash=h}
  };
}
async function firebaseAdapter(onErr){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const A=await import(base+'firebase-app.js');
  const F=await import(base+'firebase-firestore.js');
  const app=A.initializeApp(FIREBASE_CONFIG);
  let db;
  try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
  catch(e){db=F.getFirestore(app)}
  const id=n=>encodeURIComponent(n);
  return {
    label:'실시간 연결됨',
    subscribeTabs(cb){
      return F.onSnapshot(F.collection(db,'tabs'),snap=>cb(snap.docs.map(d=>({id:d.id,...d.data()})),{fromCache:snap.metadata.fromCache}),onErr);
    },
    subscribeEntries(t,cb){
      return F.onSnapshot(F.collection(db,'tabs',t,'entries'),snap=>cb(snap.docs.map(d=>({name:d.data().name,slots:d.data().slots}))),onErr);
    },
    saveEntry:(t,name,slots)=>F.setDoc(F.doc(db,'tabs',t,'entries',id(name)),{name,slots,updatedAt:F.serverTimestamp()}),
    deleteEntry:(t,name)=>F.deleteDoc(F.doc(db,'tabs',t,'entries',id(name))),
    async clearTab(t){
      const snap=await F.getDocs(F.collection(db,'tabs',t,'entries'));
      const docs=snap.docs;
      for(let i=0;i<docs.length;i+=400){
        const b=F.writeBatch(db);
        docs.slice(i,i+400).forEach(d=>b.delete(d.ref));
        await b.commit();
      }
    },
    async addTab(title,order,hue){const tid='t'+Date.now();await F.setDoc(F.doc(db,'tabs',tid),{title,order,hue});return tid},
    renameTab:(tid,title)=>F.updateDoc(F.doc(db,'tabs',tid),{title}),
    async seedTabs(){
      const base=[['t1','성역1',1,0],['t2','본부',2,1],['t3','본캐팟',3,2]];
      for(const [tid,title,order,hue] of base)await F.setDoc(F.doc(db,'tabs',tid),{title,order,hue});
    },
    async getAdminHash(){const s=await F.getDoc(F.doc(db,'config','admin'));return s.exists()?s.data().hash:null},
    setAdminHash:h=>F.setDoc(F.doc(db,'config','admin'),{hash:h})
  };
}

/* ---------- 집계 ---------- */
function agg(){
  const E=[];ents.forEach((b,n)=>{if(anyVis(b))E.push({n,b})});
  E.sort((x,y)=>x.n.localeCompare(y.n,'ko'));
  const counts=new Uint16Array(N);
  E.forEach(o=>{for(let i=0;i<N;i++)if(o.b[i])counts[i]++});
  const days=D.map((_,d)=>{
    const v=E.filter(o=>{for(let s=VIS0;s<48;s++)if(o.b[d*48+s])return true;return false}).map(o=>o.n);
    let mx=0;for(let s=VIS0;s<48;s++)mx=Math.max(mx,counts[d*48+s]);
    let best=null,st=null;
    if(mx)for(let s=VIS0;s<=48;s++){
      const ok=s<48&&counts[d*48+s]===mx;
      if(ok&&st===null)st=s;
      if(!ok&&st!==null){if(!best||s-st>best.b-best.a)best={a:st,b:s};st=null}
    }
    return {d,v,mx,best};
  });
  return {E,counts,days,tot:Math.max(E.length,1)};
}
const bounds=()=>[VIS0,48];
const anyVis=b=>{for(let d=0;d<7;d++)for(let s=VIS0;s<48;s++)if(b[d*48+s])return true;return false};

    ?`<span class="askt">"${esc(chars[ci])}"의 이 탭 체크를 지울까요?</span><button class="danger" data-act="my-yes">지우기</button><button data-act="my-no">취소</button>`
    :'<button data-act="my-ask" title="선택한 캐릭터의 체크만 이 탭에서 지웁니다">현재 탭 초기화</button>';
}
function buildGrid(){
  const [a,b]=bounds();
  let h='<div class="h" style="cursor:default"></div>';
  D.forEach((d,i)=>h+=`<div class="h" data-col="${i}"></div>`);
  for(let s=a;s<b;s++){
    const half=s%2?' half':'';
    h+=`<div class="t${half}" data-row="${s}">${lab(s)}</div>`;
    for(let d=0;d<7;d++)h+=`<div class="c${half}" data-i="${d*48+s}"></div>`;
  }
  grid.innerHTML=h;
  refresh();
}
function myBits(){return ents.get(chars[ci])}
function refresh(){
  const A=agg();
  const mb=myBits();
  grid.querySelectorAll('.c').forEach(el=>{
    const i=+el.dataset.i;
    if(view==='me'){
      el.style.background=mb&&mb[i]?'var(--accent)':'transparent';
      el.textContent='';el.classList.remove('mine');el.style.color='';
    }else{
      const c=A.counts[i];
      el.style.background=c?`color-mix(in srgb, var(--ok) ${Math.round(15+85*c/A.tot)}%, transparent)`:'transparent';
      const mine=c&&chars.some(n=>{const b=ents.get(n);return b&&b[i]});
      el.innerHTML=c?(mine?`${c}<span class="v">✓</span>`:String(c)):'';
      el.style.color=c/A.tot>0.6?'var(--on-ok)':'';
    }
  });
  const rank=A.days.filter(x=>x.v.length).sort((x,y)=>y.v.length-x.v.length||y.mx-x.mx||x.d-y.d).slice(0,2);
  grid.querySelectorAll('.h[data-col]').forEach(h=>{
    const d=+h.dataset.col,x=A.days[d];
    h.classList.remove('best','second');
    if(view==='all'){
      h.innerHTML=`${D[d]}<small>${x.v.length}명</small>`;
      if(rank[0]&&rank[0].d===d)h.classList.add('best');
      else if(rank[1]&&rank[1].d===d)h.classList.add('second');
    }else h.textContent=D[d];
  });
  const tt=curTab()?curTab().title:'';
  if(view==='me'){
    $('best').innerHTML='';
    const sd=D.filter((_,d)=>{if(!mb)return false;for(let s=VIS0;s<48;s++)if(mb[d*48+s])return true;return false});
    $('sum').textContent=`${tt} · ${chars[ci]} · 선택한 요일: ${sd.length?sd.join(', '):'없음'}`;
  }else{
    $('sum').textContent=`${tt} · 참여 ${A.E.length}명. 칸을 누르거나 올리면 그 시간 가능한 사람이 보입니다.`;
    const dups=new Map();
    if(rank.length===2){const s2=new Set(rank[1].v);rank[0].v.forEach(n=>{if(s2.has(n))dups.set(n,dups.size)})}
    const nm=n=>dups.has(n)?`<span class="nm" style="background:hsl(${Math.round((dups.get(n)*137.5)%360)} 75% 55% / .32)">${esc(n)}</span>`:`<span class="nm">${esc(n)}</span>`;
    $('best').innerHTML=(rank.length?rank.map((x,i)=>
      `<div class="box"><p>${i+1}위 ${D[x.d]}요일 · ${x.v.length}명 <span>· 최다 투표 시간 ${lab(x.best.a)}–${lab(x.best.b)} (${x.mx}명)</span></p><div class="chips">${x.v.map(nm).join('')}</div></div>`
    ).join(''):'<div class="box"><p>아직 투표한 사람이 없습니다</p></div>')+(dups.size?'<p class="dupnote">배경색이 같은 이름은 1위와 2위 요일 모두 가능한 캐릭터입니다.</p>':'');
  }
  if(admin&&!$('adm').hidden)renderAdmin();
}
function showWho(i){
  const d=Math.floor(i/48),s=i%48;
  const who=[];ents.forEach((b,n)=>{if(b[i])who.push(n)});
  who.sort((x,y)=>x.localeCompare(y,'ko'));
  $('sum').textContent=`${curTab().title} · ${D[d]} ${lab(s)} · ${who.length}명: ${who.join(', ')||'없음'}`;
}

/* ---------- 저장 ---------- */
const dkey=(t,n)=>t+'\u0000'+n;
function markDirty(name){
  const k=dkey(tabId,name);
  let d=dirty.get(k);
  if(!d){d={ver:0,timer:null,tab:tabId,name,bits:ents.get(name)};dirty.set(k,d)}
  d.bits=ents.get(name);d.ver++;
  clearTimeout(d.timer);d.timer=setTimeout(()=>flush(k),700);
  setSave('저장 중…');
}
async function flush(k){
  const d=dirty.get(k);if(!d)return;
  clearTimeout(d.timer);const v=d.ver;
  try{
    if(anyBit(d.bits))await ad.saveEntry(d.tab,d.name,toStr(d.bits));
    else await ad.deleteEntry(d.tab,d.name);
    if(dirty.get(k)===d&&d.ver===v)dirty.delete(k);
    if(!dirty.size)setSave('저장됨');
  }catch(e){
    setSave('저장 실패 · 연결을 확인하면 다시 시도합니다');
    d.timer=setTimeout(()=>flush(k),4000);
  }
}
function flushAll(){[...dirty.keys()].forEach(k=>flush(k))}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAll()});
addEventListener('pagehide',flushAll);

/* ---------- 구독 ---------- */
function onEntries(list){
  const next=new Map();
  list.forEach(e=>{if(e&&e.name)next.set(e.name,toBits(e.slots))});
  dirty.forEach(d=>{if(d.tab===tabId)next.set(d.name,d.bits)});
  ents=next;
  refresh();
}
function selectTab(id){
  flushAll();
  tabId=id;ls.set('regi_tab',id);
  if(unsubE){unsubE();unsubE=null}
  ents=new Map();
  pendDel=null;editing=null;pendReset=null;status='';pendMy=false;
  renderTabs();renderMyReset();buildGrid();
  unsubE=ad.subscribeEntries(id,onEntries);
}
function onTabs(list,meta){
  list=list.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  if(!list.length){
    if(meta&&!meta.fromCache&&!seeded){seeded=true;ad.seedTabs().catch(()=>{})}
    return;
  }
  tabs=list;
  if(!tabId||!tabs.some(t=>t.id===tabId)){
    const saved=ls.get('regi_tab','');
    selectTab(tabs.some(t=>t.id===saved)?saved:tabs[0].id);
  }else{
    renderTabs();refresh();
  }
}

/* ---------- 체크판 입력 ---------- */
function setCell(el,v){
  const name=chars[ci];
  let b=ents.get(name);
  if(!b){b=new Uint8Array(N);ents.set(name,b)}
  const i=+el.dataset.i;
  b[i]=v?1:0;
  markDirty(name);
  el.style.background=v?'var(--accent)':'transparent';
}
function cellAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  return el&&el.classList&&el.classList.contains('c')&&grid.contains(el)?el:null;
}
function curVal(el){const b=ents.get(chars[ci]);return !!(b&&b[+el.dataset.i])}
grid.addEventListener('pointerdown',e=>{
  if(view!=='me')return;
  const el=e.target.closest('.c');if(!el)return;
  if(e.pointerType==='touch'){touchStart={x:e.clientX,y:e.clientY,el};return}
  dragging=true;paint=!curVal(el);setCell(el,paint);
  e.preventDefault();
});
grid.addEventListener('pointermove',e=>{
  const el=cellAt(e);
  if(dragging&&el){setCell(el,paint)}
  else if(!dragging&&view==='all'&&el&&e.pointerType==='mouse')showWho(+el.dataset.i);
});
grid.addEventListener('pointerup',e=>{
  if(touchStart){
    const dx=Math.abs(e.clientX-touchStart.x),dy=Math.abs(e.clientY-touchStart.y);
    if(dx<10&&dy<10){const el=touchStart.el;setCell(el,!curVal(el))}
    touchStart=null;refresh();
  }
});
grid.addEventListener('pointercancel',()=>{touchStart=null});
addEventListener('pointerup',()=>{if(dragging){dragging=false;refresh()}});
grid.addEventListener('click',e=>{
  const h=e.target.closest('.h[data-col]'),t=e.target.closest('.t'),c=e.target.closest('.c');
  if(view==='all'){if(c)showWho(+c.dataset.i);return}
  const [a,b]=bounds();
  const name=chars[ci];
  const ensure=()=>{let x=ents.get(name);if(!x){x=new Uint8Array(N);ents.set(name,x)}return x};
  if(h){
    const d=+h.dataset.col,x=ensure();let all=true;
    for(let s=a;s<b;s++)if(!x[d*48+s])all=false;
    for(let s=a;s<b;s++)x[d*48+s]=all?0:1;
    markDirty(name);refresh();
  }else if(t){
    const s=+t.dataset.row,x=ensure();let all=true;
    for(let d=0;d<7;d++)if(!x[d*48+s])all=false;
    for(let d=0;d<7;d++)x[d*48+s]=all?0:1;
    markDirty(name);refresh();
  }
});

$('tabs').addEventListener('click',e=>{

function clearDirtyName(name){[...dirty.entries()].forEach(([k,d])=>{if(d.name===name){clearTimeout(d.timer);dirty.delete(k)}})}
async function deleteChar(){

$('crow').addEventListener('click',e=>{

$('myreset').addEventListener('click',e=>{

function addChar(){

$('cadd').addEventListener('click',addChar);
$('cn').addEventListener('keydown',e=>{if(e.key==='Enter')addChar()});
$('cn').addEventListener('input',()=>{$('cerr').textContent=''});
$('ccancel').addEventListener('click',()=>{$('addrow').hidden=true;$('cerr').textContent=''});
$('vseg').addEventListener('click',e=>{

/* ---------- 관리자 ---------- */
async function loadAdminHash(){
  if(adminHash!==undefined)return;
  try{adminHash=await ad.getAdminHash()}catch(e){adminHash=undefined;setErrMsg('관리자 정보를 불러오지 못했습니다.')}
}
function setErrMsg(m){const e=$('aerr');if(e)e.textContent=m;status='';const o=$('aok');if(o)o.textContent=''}
function done(m){status=m;renderAdmin()}
function nameList(){
  const l=[];ents.forEach((b,n)=>{if(anyBit(b))l.push(n)});
  return l.sort((x,y)=>x.localeCompare(y,'ko'));
}
function renderAdmin(){
  const w=$('adm');
  if(!admin){
    if(adminHash===undefined){w.innerHTML='<p class="lbl" style="margin:0">불러오는 중…</p>';return}
    if(adminHash===null){
      w.innerHTML='<div class="sec"><span class="lbl">관리자 코드 처음 설정</span><div class="row" style="margin:0"><input id="ac" type="password" placeholder="새 관리자 코드 (4자 이상)" style="width:220px" autocomplete="off"><button data-act="setcode" style="font-weight:600">설정</button></div><p class="lbl" style="margin:6px 0 0">이 코드를 아는 사람만 탭을 추가하고 투표를 초기화할 수 있습니다.</p></div><p class="err" id="aerr" style="margin:6px 0 0"></p>';
    }else{
      w.innerHTML='<div class="row" style="margin:0"><input id="ac" type="password" placeholder="관리자 코드" style="width:170px" autocomplete="off"><button data-act="login" style="font-weight:600">확인</button></div><p class="err" id="aerr" style="margin:6px 0 0"></p>';
    }

  }

  h+='<div class="sec"><span class="lbl">투표 초기화 (새 주 시작)</span><div class="row" style="margin:0">';

  else if(pendReset==='all')h+=`<span>모든 탭(${tabs.length}개)의 투표를 지울까요?</span><button class="danger" data-act="reset-yes">예, 모두 지우기</button><button data-act="reset-no">취소</button>`;
  else h+='<button data-act="reset-tab">현재 탭 전체 초기화</button><button data-act="reset-all">전체 탭 초기화</button><span class="lbl">탭과 이름은 그대로 남습니다</span>';
  h+='</div></div>';
  h+=`<div class="sec" style="margin-bottom:6px"><span class="lbl">참여자 관리 · ${esc(t.title)} · ${list.length}명</span><div class="pl">`;
  if(!list.length)h+='<span class="lbl">참여자가 없습니다</span>';
  list.forEach(n=>{

    else if(pendDel===n)h+=`<span class="pi ask">${esc(n)} 삭제?<button data-act="del-yes" data-n="${esc(n)}">예</button><button data-act="del-no">아니오</button></span>`;
    else h+=`<span class="pi">${esc(n)}<button data-act="ren" data-n="${esc(n)}" aria-label="${esc(n)} 이름 수정">수정</button><button data-act="del" data-n="${esc(n)}" aria-label="${esc(n)} 삭제">삭제</button></span>`;

$('admbtn').addEventListener('click',async()=>{
  const w=$('adm');w.hidden=!w.hidden;
  if(!w.hidden){renderAdmin();await loadAdminHash();renderAdmin()}
});
$('adm').addEventListener('input',e=>{if(e.target.id==='tn')tnVal=e.target.value});
$('adm').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const b=e.target.id==='ac'?$('adm').querySelector('[data-act=login],[data-act=setcode]'):null;
  if(b)b.click();
});
function clearDirtyFor(tid){
  [...dirty.entries()].forEach(([k,d])=>{if(d.tab===tid){clearTimeout(d.timer);dirty.delete(k)}});
}
$('adm').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.act)return;
  const act=b.dataset.act,n=b.dataset.n,t=curTab();
  try{
    if(act==='setcode'){
      const v=$('ac').value;
      if(v.length<4){setErrMsg('4자 이상 입력하세요.');return}
      const h=await sha(v);await ad.setAdminHash(h);adminHash=h;
      admin=true;ss.set('regi_admin','1');done('관리자 코드를 설정했습니다.');return;
    }
    if(act==='login'){
      const h=await sha($('ac').value);
      if(h===adminHash){admin=true;ss.set('regi_admin','1');renderAdmin()}
      else setErrMsg('관리자 코드가 맞지 않습니다.');
      return;
    }
    if(act==='alogout'){admin=false;ss.del('regi_admin');pendDel=null;editing=null;pendReset=null;status='';renderAdmin();return}
    if(act==='chcode'){
      const v=$('nc').value;
      if(v.length<4){setErrMsg('4자 이상 입력하세요.');return}
      const h=await sha(v);await ad.setAdminHash(h);adminHash=h;
      done('관리자 코드를 변경했습니다.');return;
    }
    if(act==='tadd'||act==='tren'){
      const v=tnVal.trim();
      if(!v){setErrMsg('탭 이름을 입력하세요.');return}
      if(tabs.some(x=>x.title===v)){setErrMsg('이미 있는 탭 이름입니다.');return}
      if(act==='tadd'){
        const order=Math.max(0,...tabs.map(x=>x.order||0))+1;
        const id=await ad.addTab(v,order,tabs.length);
        tnVal='';selectTab(id);done('탭을 추가했습니다.');
      }else{
        await ad.renameTab(tabId,v);tnVal='';done('탭 이름을 바꿨습니다.');
      }
      return;
    }
    if(act==='reset-tab'){pendReset='tab';status='';renderAdmin();return}
    if(act==='reset-all'){pendReset='all';status='';renderAdmin();return}
    if(act==='reset-no'){pendReset=null;renderAdmin();return}
    if(act==='reset-yes'){
      const all=pendReset==='all';pendReset=null;
      const targets=all?tabs.map(x=>x.id):[tabId];
      for(const id of targets){clearDirtyFor(id);await ad.clearTab(id)}
      done(all?'모든 탭의 투표를 초기화했습니다.':`"${t.title}" 탭의 투표를 초기화했습니다.`);return;
    }
    if(act==='del'){pendDel=n;editing=null;status='';renderAdmin();return}
    if(act==='del-no'){pendDel=null;renderAdmin();return}
    if(act==='del-yes'){
      clearDirtyFor(tabId);
      await ad.deleteEntry(tabId,n);pendDel=null;
      done(`"${n}" 참여자를 삭제했습니다.`);return;
    }
    if(act==='ren'){editing=n;pendDel=null;status='';renderAdmin();return}
    if(act==='ren-no'){editing=null;renderAdmin();return}
    if(act==='ren-save'){
      const nv=$('en').value.trim();
      const m=validName(nv);
      if(m){setErrMsg(m);return}
      if(nv===n){editing=null;renderAdmin();return}
      const src=ents.get(n),dst=ents.get(nv);
      const bits=new Uint8Array(src);
      if(dst)for(let i=0;i<N;i++)bits[i]|=dst[i];
      editing=null;
      clearDirtyFor(tabId);
      await ad.saveEntry(tabId,nv,toStr(bits));
      await ad.deleteEntry(tabId,n);
      if(chars.includes(n)){chars=[...new Set(chars.map(c=>c===n?nv:c))];ci=Math.min(ci,chars.length-1);saveChars();renderChars()}
      done(dst?`"${n}"을(를) "${nv}"에 합쳤습니다. 체크는 둘을 합친 결과입니다.`:`"${n}" 이름을 "${nv}"(으)로 바꿨습니다.`);
      return;
    }
  }catch(err){
    setErrMsg('처리하지 못했습니다. 연결을 확인하고 다시 시도하세요.');
  }
});

/* ---------- 시작 ---------- */
function keepStorage(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
function startMain(){
  $('onboard').hidden=true;$('main').hidden=false;
  renderChars();renderMyReset();
  if(tabs.length)refresh();
  keepStorage();
}
function showOnboard(){
  $('main').hidden=true;$('onboard').hidden=false;
  $('ob-name').value='';$('ob-err').textContent='';
}
function goOnboard(){
  const v=$('ob-name').value.trim(),m=validName(v);
  if(m){$('ob-err').textContent=m;return}
  chars=[v];ci=0;saveChars();startMain();
}
$('ob-go').addEventListener('click',goOnboard);
$('ob-name').addEventListener('keydown',e=>{if(e.key==='Enter')goOnboard()});
$('ob-name').addEventListener('input',()=>{$('ob-err').textContent=''});
let deferredPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(!standalone())$('install').style.display='inline-block';
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
addEventListener('appinstalled',()=>{$('install').style.display='none';$('ihint').hidden=true});
$('install').addEventListener('click',async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return;
  }
  const h=$('ihint');
  h.textContent=isIOS()?'아이폰은 사파리에서 하단의 공유 버튼을 누른 뒤 "홈 화면에 추가"를 선택하세요.':'브라우저 메뉴(⋮)에서 "앱 설치" 또는 "홈 화면에 추가"를 선택하세요.';
  h.hidden=!h.hidden;
});
addEventListener('online',()=>setConn('on',ad?ad.label:''));
addEventListener('offline',()=>setConn('err','오프라인'));

(async()=>{
  if(chars.length)startMain();else showOnboard();
  try{
    if(DEMO){ad=demoAdapter()}
    else{
      ad=await firebaseAdapter(err=>{
        console.error(err);
        setConn('err',err&&err.code==='permission-denied'?'권한 오류 (보안 규칙 확인)':'연결 오류');
      });
    }
    setConn(navigator.onLine?'on':'err',navigator.onLine?ad.label:'오프라인');
    ad.subscribeTabs(onTabs);
    if(admin){await loadAdminHash()}
  }catch(e){
    console.error(e);
    setConn('err','연결하지 못했습니다');
  }
  if(!DEMO&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
